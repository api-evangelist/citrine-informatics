aid: citrine-informatics
name: Citrine Informatics
description: >-
  Citrine Informatics is an enterprise AI software company for materials and chemicals product
  development, positioning itself as the world leader in generative AI for the space. The Citrine
  Platform pairs Citrine DataManager (capturing and organizing organizational materials knowledge on
  the open-source GEMD data model) with Citrine VirtualLab (running thousands of virtual experiments
  via Sequential Learning to identify promising formulations), supported by Citrine Catalyst and
  professional services. Developers integrate through the first-party Python SDK (the "citrine" and
  "gemd" PyPI libraries) to upload and manage data, build tables, and configure predictors and design
  spaces. Citrine serves 15+ industries including specialty chemicals, coatings/adhesives/sealants,
  plastics, personal care, food & beverage, batteries, and metals & alloys, with customers such as
  LyondellBasell, Eastman, Grace, Stepan, and Collano, plus a DARPA INTACT ceramics program.
